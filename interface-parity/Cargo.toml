[package]
name = "interface-parity"
version = "0.1.0"
description = "Lists every difference between what paired EVM and Solana repositories publish."
edition = "2024"
license = "GPL-3.0"
publish = false

[dependencies]
anyhow = "1.0"
cargo_metadata = "0.23"
hex = "0.4"
public-api = "=0.52.2"
rustdoc-json = "=0.9.10"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["unbounded_depth"] }
sha2 = "0.11.0"
toml = "1"
