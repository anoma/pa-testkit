[package]
name = "anoma-pa-testkit"
description = "Backend-agnostic risc0 test core for Anoma integration testing."
version = "0.3.0"
authors = ["Heliax <hello@heliax.dev>"]
edition = "2024"
license = "GPL-3.0"
readme = "README.md"

# The fixtures and local prover are the testkit's core, so they are on by
# default — this also lets `cargo test` run the `tests/trivial_action.rs` smoke
# tests without extra flags. Lean consumers can opt out with
# `default-features = false`.
[features]
default = ["fixtures", "local"]
mocks = ["dep:mockall"]
# Action/resource fixtures and the test identities that drive them. The
# identities pull in secp256k1 + authority-key material.
fixtures = ["dep:anoma-rm-risc0-gadgets", "dep:k256", "dep:bincode", "dep:hex"]

# proving backends (risc0)
local = ["dep:bincode", "dep:sha2"]
e2e = [
  "dep:bincode",
  "dep:futures",
  "dep:heliax-ap-orchestrator-sdk",
  "dep:serde",
  "dep:tokio",
]

[dependencies]
# Pinned by git rev until arm-risc0 publishes v2 to crates.io (v2.0.0-rc.3;
# crates.io carries only up to 2.0.0-pre.1, which predates the compact
# aggregation instance and the action-tree-root delta message).
anoma-rm-risc0 = { git = "https://github.com/anoma/arm-risc0", rev = "784fb37c27a4fec51b99d7d3f004ee3e4b5b5695", default-features = false, features = [
  "transaction",
  "compliance_circuit",
  "aggregation",
] }
anoma-rm-risc0-gadgets = { git = "https://github.com/anoma/arm-risc0", rev = "784fb37c27a4fec51b99d7d3f004ee3e4b5b5695", optional = true }
anyhow = "1.0"
bincode = { version = "1.3.3", optional = true }
futures = { version = "0.3", optional = true }
heliax-ap-orchestrator-sdk = { version = "0.14.0", optional = true }
hex = { version = "0.4", optional = true }
k256 = { version = "0.13.3", optional = true }
mockall = { version = "0.14.0", optional = true }
regex = "1"
risc0-zkvm = "3.0.3"
serde = { version = "1", optional = true }
sha2 = { version = "0.11.0", optional = true }
tokio = { version = "1.48", features = ["time"], optional = true }

[dev-dependencies]
# For the chain-free trivial-action / local-prover tests under `tests/`
# (run with `--features local,fixtures`).
tokio = { version = "1.48", features = ["macros", "rt-multi-thread"] }
